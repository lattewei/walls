services:
  db:
    image: postgres:16-alpine
    container_name: openstudio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openstudio_dev}
      POSTGRES_DB: ${POSTGRES_DB:-openstudio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - openstudio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openstudio} -d ${POSTGRES_DB:-openstudio}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openstudio_pgdata:
